name: Docker Hub Dev Image Cleanup

on:
  schedule:
    - cron: '5 0 * * *' # every day at 00:05 UTC

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old Docker Hub dev tags
    permissions:
      contents: read
    steps:
      - name: Delete PR and RC tags older than seven days
        env:
          DOCKERHUB_NAMESPACE: wesdobry
          DOCKERHUB_REPOSITORY: tubeless-dev
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          auth_payload=$(jq -cn \
            --arg identifier "$DOCKERHUB_USERNAME" \
            --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}')
          access_token=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$auth_payload" \
            https://hub.docker.com/v2/auth/token | jq -er '.access_token')

          cutoff=$(date -u -d '7 days ago' +%s)
          url="https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags?page_size=100"
          deleted=0

          while [ -n "$url" ]; do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $access_token" \
              "$url")

            mapfile -t stale_tags < <(jq -r --argjson cutoff "$cutoff" '
              .results[]
              | select(.name | test("^(pr|rc)-"))
              | select((.last_updated | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff)
              | .name
            ' <<< "$response")

            for tag in "${stale_tags[@]}"; do
              curl --fail --silent --show-error --output /dev/null \
                -X DELETE \
                -H "Authorization: Bearer $access_token" \
                "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags/${tag}"
              echo "Deleted ${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPOSITORY}:${tag}"
              deleted=$((deleted + 1))
            done

            url=$(jq -r '.next // empty' <<< "$response")
          done

          echo "Deleted $deleted stale dev tag(s)."
